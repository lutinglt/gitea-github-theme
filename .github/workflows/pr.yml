name: pr

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - check
          - format
          - test
          - build
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: bun install

      - name: Check
        if: matrix.check == 'check'
        run: bun check

      - name: Format
        if: matrix.check == 'format'
        run: bun fmt:check

      - name: Test
        if: matrix.check == 'test'
        run: bun vitest --run

      - name: Build
        id: build
        if: matrix.check == 'build'
        run: bun run build

      - name: Upload css assets
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: themes
          path: dist/*.css

      - name: Upload templates assets
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: templates
          path: templates
